global       
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 1d

#   log /dev/log local0
#   log /dev/log local1 notice
#   log /dev/log local0 info
    
    tune.h2.initial-window-size 2147483647
    tune.ssl.default-dh-param 2048

    pidfile /run/haproxy.pid
    chroot /var/lib/haproxy

    user haproxy
    group haproxy
    daemon

    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

defaults
    log global
    mode tcp
    option dontlognull
    timeout connect 200ms
    timeout client  300s
    timeout server  300s
    
# --- PINTU MASUK UTAMA PORT HTTPS & MULTIPORT ---
frontend multiport
    mode tcp
    bind-process 1 2
    bind *:2053 tfo
    bind *:443 tfo
    tcp-request inspect-delay 500ms
    tcp-request content accept if HTTP
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend recir_http if HTTP 
    default_backend recir_https

frontend multiports
    mode tcp
    bind abns@haproxy-http accept-proxy tfo
    default_backend recir_https_www

# --- PINTU PEMILAH (TRAFFIC ROUTING CHANGER) ---
frontend ssl
    mode tcp
    bind-process 1
    bind *:80 tfo
    bind *:8080 tfo
    bind abns@haproxy-https accept-proxy ssl crt /etc/haproxy/hap.pem alpn h2,http/1.1 tfo
    
    tcp-request inspect-delay 500ms
    tcp-request content capture req.ssl_sni len 100
    tcp-request content accept if { req.ssl_hello_type 1 }

    # 1. DETEKSI JALUR SSH MURNI
    acl is_ssh payload(0,7) -m bin 5353482d322e30
    use_backend SSH_DIRECT if is_ssh

    # 2. DETEKSI PATH XRAY WEBSOCKET (WS)
    acl path_vless_ws path -i /vless
    acl path_vmess_ws path -i /vmess
    acl path_trojan_ws path -i /trojan-ws
    acl path_ss_ws    path -i /ss-ws

    use_backend XRAY_VLESS_WS  if path_vless_ws
    use_backend XRAY_VMESS_WS  if path_vmess_ws
    use_backend XRAY_TROJAN_WS if path_trojan_ws
    use_backend XRAY_SS_WS     if path_ss_ws

    # 3. DETEKSI PATH XRAY HTTP UPGRADE (UP)
    acl path_vless_up path -i /vless-up
    acl path_vmess_up path -i /vmess-up
    acl path_trojan_up path -i /trojan-up

    use_backend XRAY_VLESS_UP  if path_vless_up
    use_backend XRAY_VMESS_UP  if path_vmess_up
    use_backend XRAY_TROJAN_UP if path_trojan_up

    # 4. DETEKSI XRAY gRPC (ALPN h2)
    acl is_grpc ssl_fc_alpn -i h2
    acl grpc_vless path -i /vless-grpc
    acl grpc_vmess path -i /vmess-grpc
    acl grpc_trojan path -i /trojan-grpc
    acl grpc_ss    path -i /ss-grpc

    use_backend XRAY_VLESS_GRPC  if is_grpc grpc_vless
    use_backend XRAY_VMESS_GRPC  if is_grpc grpc_vmess
    use_backend XRAY_TROJAN_GRPC if is_grpc grpc_trojan
    use_backend XRAY_SS_GRPC     if is_grpc grpc_ss

    # 5. JALUR CADANGAN / DEFAULT FALLBACK
    default_backend OPENVPN_TCP

# --- JALUR NON-XRAY (SSH, VPN & FALLBACK) ---
backend SSH_DIRECT
    mode tcp
    server dropbear-ssh 127.0.0.1:2222 check

backend OPENVPN_TCP
    mode tcp
    server openvpn-local 127.0.0.1:1194 check

backend recir_https_www
    mode tcp
    server fallback-http 127.0.0.1:2223 check

# --- KELOMPOK XRAY WEBSOCKET (WS) ---
backend XRAY_VLESS_WS
    mode tcp
    server xray-vless-ws 127.0.0.1:10001 send-proxy check

backend XRAY_VMESS_WS
    mode tcp
    server xray-vmess-ws 127.0.0.1:10002 send-proxy check

backend XRAY_TROJAN_WS
    mode tcp
    server xray-trojan-ws 127.0.0.1:10003 send-proxy check

backend XRAY_SS_WS
    mode tcp
    server xray-ss-ws 127.0.0.1:10004 send-proxy check

# --- KELOMPOK XRAY gRPC ---
backend XRAY_VLESS_GRPC
    mode tcp
    server xray-vless-grpc 127.0.0.1:10005 send-proxy check

backend XRAY_VMESS_GRPC
    mode tcp
    server xray-vmess-grpc 127.0.0.1:10006 send-proxy check

backend XRAY_TROJAN_GRPC
    mode tcp
    server xray-trojan-grpc 127.0.0.1:10007 send-proxy check

backend XRAY_SS_GRPC
    mode tcp
    server xray-ss-grpc 127.0.0.1:10008 send-proxy check

# --- KELOMPOK XRAY HTTP UPGRADE (UP) ---
backend XRAY_VLESS_UP
    mode tcp
    server xray-vless-up 127.0.0.1:10009 send-proxy check

backend XRAY_VMESS_UP
    mode tcp
    server xray-vmess-up 127.0.0.1:10010 send-proxy check

backend XRAY_TROJAN_UP
    mode tcp
    server xray-trojan-up 127.0.0.1:10011 send-proxy check
    
# --- LOOPBACK INTERNAL KONEKSI ---
backend recir_http
    mode tcp
    server loopback-for-http abns@haproxy-http send-proxy-v2 check
    
backend recir_https
    mode tcp
    server loopback-for-https abns@haproxy-https send-proxy-v2 check
